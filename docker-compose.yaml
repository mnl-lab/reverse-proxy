services:
  # --- THE AI SECURITY BRAIN ---
  ai-guardian:
    build: ./ai_waf  
    ports:
      - "5000:5000"  
    networks:
      - RP-net

  # ---BACKENDS ---
  backend-alpha:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./backends/node:/app
    command: sh -c "npm install && node server.js"
    environment:
      - SERVER_ID=Node-Alpha [EU-West]
      - SERVER_COLOR=#007BFF
      - PORT=8080
    ports:
      - "8082:8080"
    networks:
      - RP-net

  backend-beta:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./backends/node:/app
    command: sh -c "npm install && node server.js"
    environment:
      - SERVER_ID=Node-Beta [US-East]
      - SERVER_COLOR=#28A745
      - PORT=8080
    ports:
      - "8083:8080"
    networks:
      - RP-net

  backend-gamma:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./backends/node:/app
    command: sh -c "npm install && node server.js"
    environment:
      - SERVER_ID=Node-Gamma [AP-South]
      - SERVER_COLOR=#6F42C1
      - PORT=8080
    ports:
      - "8084:8080"
    networks:
      - RP-net


networks:
  RP-net:
    driver: bridge